name: remote_desktop
description: Remote desktop control system with WebRTC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.6
  http: ^1.2.0
  logging: ^1.2.0
  provider: ^6.1.1
  screen_retriever: ^0.2.0
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
